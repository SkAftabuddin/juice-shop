name: Security CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

# 🔐 1. Gitleaks
 gitleaks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install Gitleaks
        run: |
         go install github.com/zricethezav/gitleaks/v8@latest
         echo "$HOME/go/bin" >> $GITHUB_PATH


      - name: Run Gitleaks Scan
        continue-on-error: true
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path=gitleaks-report.json || exit 0

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          
# 🔐 2. Sonar
 sonar:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [gitleaks, trivy]
    steps:
      - uses: actions/checkout@v3
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=skaftabuddin_devsecops-pipeline-demo
            -Dsonar.organization=skaftabuddin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


# 📦 3. OWASP Dependency Check
 dependency-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: gitleaks

    steps:
      - uses: actions/checkout@v3

      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "juice-shop"
          path: "."
          format: "HTML"
          args: >
            --disableArchive

          
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: reports/

# 🧾 4. Build

 build:
  runs-on: ubuntu-latest
  continue-on-error: true

  steps:
    - uses: actions/checkout@v3

    - name: Build Application
      run: |
        echo "Building application..."
        npm install
        npm run build || echo "No build step"
        

# 🧾 5. SBOM Syft
 sbom:
    runs-on: ubuntu-latest
    needs: dependency-check
    continue-on-error: true

    steps:
      - uses: actions/checkout@v3

      - name: Install Syft
        run: |
           curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Verify Syft
        run: syft version

      
      - name: Generate SBOM
        run: |
          syft . -o json > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  
#🔎 6. Trivy FS scan
 trivy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          

#🔎 7. Deploy to Staging
 deploy_staging:
   runs-on: ubuntu-latest
   needs: build
   continue-on-error: true

   steps:
    - name: Deploy to Staging
      run: |
        echo "===== DEPLOY TO STAGING ====="
        echo "Trigger Codespaces manually"
        echo "Run app in Codespaces:"
        echo "npm install && npm start"
        echo "Copy Codespaces URL-https://bookish-space-capybara-xpw9pppr974f475-3000.app.github.dev/#/"

#🔎 7. zap scan

 zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        
      - name: Run ZAP Baseline Scan
        continue-on-error: true
        run: |
         mkdir -p zap-output
         docker run --rm \
           -u root \
           -v $(pwd)/zap-output:/zap/wrk/:rw \
            zaproxy/zap-stable \
            zap-baseline.py \
           -t https://bookish-space-capybara-xpw9pppr974f475-3000.app.github.dev/#/ \
           -I \
           -r report.html

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-output/report.html

#🔎 7. Deploy to Production    

 deploy_prod:
  runs-on: ubuntu-latest
  needs: zap_scan

  steps:
    - name: Deploy to Production
      continue-on-error: true
      run: |
        echo "===== DEPLOY TO PRODUCTION ====="
        echo "Deploying application to Render..."
        echo "Production deployment successful!"
