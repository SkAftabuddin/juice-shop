name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

# ✅ 1. GITLEAKS (Secrets Scan)
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2


# ✅ 2. TRIVY (Filesystem scan)
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'


# ✅ 3. SONARCLOUD (Code Quality)
  sonar:
    runs-on: ubuntu-latest
    needs: [gitleaks, trivy]
    steps:
      - uses: actions/checkout@v3
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=skaftabuddin_devsecops-pipeline-demo
            -Dsonar.organization=skaftabuddin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


# ✅ 4. ZAP (DAST Scan)
  zap_scan:
    runs-on: ubuntu-latest
    needs: sonar
    steps:
      - uses: actions/checkout@v3

      - name: Run ZAP Baseline
        continue-on-error: true
        run: |
          mkdir -p zap-output
          docker run --rm \
            -u root \
            -v $(pwd)/zap-output:/zap/wrk/:rw \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t https://bookish-space-capybara-xpw9pppr974f475-3000.app.github.dev/#/ \
            -I \
            -r report.html

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-output/report.html
