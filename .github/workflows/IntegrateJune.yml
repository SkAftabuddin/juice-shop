name: IntegrateJune

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

# 🔐 1. Gitleaks
  gitleaks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Run Gitleaks
        run: |
          gitleaks detect --source . --report-format json --report-path=gitleaks.json || true
      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json


# 📦 2. Dependency Check
  dependency-check:
    runs-on: ubuntu-latest
    needs: gitleaks
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3

      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "juice-shop"
          path: "."
          format: "HTML"
          args: >
            --disableArchive
      
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reportM
          path: reports/


# 🧾 3. SBOM
  sbom:
    runs-on: ubuntu-latest
    needs: dependency-check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
      - run: syft version

      - name: Generate SBOM
        run: syft . -o json > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

       


# 🔐 4. Sonar
  sonar:
    runs-on: ubuntu-latest
    needs: sbom
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3

      - name: Sonar Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=skaftabuddin_devsecops-pipeline-demo
            -Dsonar.organization=skaftabuddin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Sonar Report
        uses: actions/upload-artifact@v4
        with:
         name: sonar-reportM
         path: .scannerwork/

    


# 🧾 5. Build
  build:
    runs-on: ubuntu-latest
    needs: sonar
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3

      - name: Build
        run: |
          echo "===== BUILD ====="
          npm install
          npm run build || echo "no build"

# 🔎 6. Trivy for Container Security
  trivy:
    runs-on: ubuntu-latest
    needs: sbom
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: 'json'
          output: 'trivy-report.json'
          severity: CRITICAL,HIGH

 
      - name: Verify Trivy Report Exists
        run: | 
         echo "Listing generated files:"
        
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
         name: trivy-report
         path: trivy-report.json


          
# 🚀 7. Deploy Staging (Codespaces simulated)
  deploy_staging:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Deploy Staging
        run: |
          echo "===== STAGING ====="
          echo "Start Codespaces manually"
          echo "npm install && npm start"
          echo "App deployed in Staging-https://bookish-space-capybara-xpw9pppr974f475-3000.app.github.dev/#/"
# 🌐 8. ZAP Scan
  zap_scan:
    runs-on: ubuntu-latest
    needs: deploy_staging
    continue-on-error: true
    steps:
      - name: ZAP Scan
        run: |
          mkdir -p zap-output
          docker run --rm \
            -u root \
            -v $(pwd)/zap-output:/zap/wrk/:rw \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t https://bookish-space-capybara-xpw9pppr974f475-3000.app.github.dev \
            -I \
            -r report.html
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-reportM
          path: zap-output/report.html


# 🚀 9. Deploy Production
  deploy_prod:
    runs-on: ubuntu-latest
    needs: zap_scan
    steps:
      - name: Deploy Production
        run: |
          echo "===== PRODUCTION ====="
          echo "Deploying to Render"
          echo "APP Online in https://devsecops-pipeline-demo.onrender.com/#/ "
